<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viewer</title>
<link rel="icon" href="/Photos/OIP.png" type="image/png">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #f2f2f2;
    transition: background-color 0.4s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    body { transition: none; }
  }
</style>
</head>
<body>
<script>
  // Viewers just watch: the controller at /main decides the color.
  var events = new EventSource("/events");
  events.onmessage = function (e) {
    document.body.style.backgroundColor = JSON.parse(e.data).color;
  };
</script>
</body>
</html>
