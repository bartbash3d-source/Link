<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Editor</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #f2f2f2;
    transition: background-color 0.4s ease;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    padding: 20px;
    margin-bottom: 24px;
  }
  button {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  button:hover { transform: scale(1.1); }
  button:active { transform: scale(0.95); }
  button:focus-visible { outline: 3px solid #000; outline-offset: 3px; }
  #msg {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: #111; color: #fff; padding: 8px 14px; border-radius: 8px;
    font-size: 14px; display: none;
  }
  @media (prefers-reduced-motion: reduce) {
    body, button { transition: none; }
  }
</style>
</head>
<body>
  <div id="msg" role="alert"></div>
  <div class="bar" id="bar"></div>
<script>
  var colors = [
    { name: "Red", value: "#e63946" },
    { name: "Orange", value: "#f77f00" },
    { name: "Yellow", value: "#fcd34d" },
    { name: "Green", value: "#2a9d5c" },
    { name: "Blue", value: "#1d6fd6" },
    { name: "Purple", value: "#7b2cbf" },
    { name: "Pink", value: "#ff6fa5" },
    { name: "Black", value: "#111111" },
    { name: "White", value: "#ffffff" }
  ];

  // If /main was opened with ?key=..., send it along with each press.
  var key = new URLSearchParams(location.search).get("key") || "";

  function setScreen(color) {
    document.body.style.backgroundColor = color;
  }

  function showMsg(text) {
    var m = document.getElementById("msg");
    m.textContent = text;
    m.style.display = "block";
    setTimeout(function () { m.style.display = "none"; }, 3000);
  }

  var events = new EventSource("/events");
  events.onmessage = function (e) {
    setScreen(JSON.parse(e.data).color);
  };

  var bar = document.getElementById("bar");
  colors.forEach(function (c) {
    var b = document.createElement("button");
    b.style.background = c.value;
    b.setAttribute("aria-label", "Change screen to " + c.name);
    b.addEventListener("click", function () {
      setScreen(c.value);
      fetch("/color", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-control-key": key },
        body: JSON.stringify({ color: c.value })
      }).then(function (r) {
        if (!r.ok) showMsg("Could not change color (" + r.status + ")");
      }).catch(function () { showMsg("Could not reach the server"); });
    });
    bar.appendChild(b);
  });
</script>
</body>
</html>
